# Service du dashboard (SPA React compilée par Vite).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compression des réponses texte.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Sonde de disponibilité pour l'orchestrateur / le smoke test CI.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets fingerprintés par Vite (hash dans le nom) : cache long immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routage côté client : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais être mis en cache, sinon un déploiement ne se
    # voit pas côté navigateur.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
