# Service du dashboard (SPA React compilée par Vite).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- En-têtes de sécurité ---------------------------------------------
    # `always` : sans ce mot-clé, Nginx n'ajoute l'en-tête qu'aux réponses
    # 2xx/3xx, et une page d'erreur repartirait sans protection.
    #
    # La politique de sécurité de contenu est la vraie parade au vol du jeton :
    # celui-ci vit dans sessionStorage, donc lisible par un script injecté. La
    # CSP empêche ce script d'être chargé.
    #
    #   script-src 'self'         : le bundle Vite ne contient aucun script
    #                               inline, aucune exception n'est nécessaire.
    #   style-src 'unsafe-inline' : concession assumée. React et Recharts
    #                               posent des attributs style sur les
    #                               éléments, que la CSP bloquerait sinon.
    #   connect-src 'self'        : le dashboard ne parle qu'à l'API métier,
    #                               servie sous /api/v1 derrière le même
    #                               Traefik. ATTENTION : si VITE_API_BASE_URL
    #                               pointe une autre origine, l'ajouter ici,
    #                               sinon le navigateur bloquera tous les
    #                               appels.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # Interdit au navigateur de deviner un type MIME : un fichier téléversé
    # qui serait servi en text/plain ne peut pas être exécuté comme du script.
    add_header X-Content-Type-Options "nosniff" always;

    # Le dashboard n'a aucune raison d'être encadré. Double emploi voulu avec
    # frame-ancestors, pour les navigateurs qui ignorent encore la directive.
    add_header X-Frame-Options "DENY" always;

    # L'URL complète ne fuit pas vers un tiers ; l'origine seule suffit.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aucune de ces interfaces n'est utilisée par le dashboard.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # Compression des réponses texte.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Sonde de disponibilité pour l'orchestrateur / le smoke test CI.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets fingerprintés par Vite (hash dans le nom) : cache long immuable.
    # Rappel des en-têtes de sécurité : un add_header dans un bloc location
    # remplace tous ceux hérités du bloc server, il ne s'y ajoute pas. Les
    # omettre ici servirait les assets sans aucune protection.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Routage côté client : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais être mis en cache, sinon un déploiement ne se
    # voit pas côté navigateur.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    }
}
