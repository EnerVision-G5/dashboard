# Service du dashboard (SPA React compilée par Vite).

server {
    listen       8080;
    server_name  _;

    # Ne publie pas le numéro de version de Nginx dans l'en-tête Server ni sur
    # les pages d'erreur : une version connue oriente directement la recherche
    # de CVE applicables. Relevé par le scan OWASP ZAP de la CI (10036).
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Voir security-headers.conf.template pour le détail de chaque en-tête ;
    # le fichier inclus ici en est la version substituée par l'entrée de
    # l'image au démarrage du conteneur. Un add_header posé ici ne survit PAS
    # dans une location qui en pose un des siens : c'est pour ça que le fichier
    # est réinclus dans /assets/ et /index.html plutôt que supposé hérité.
    include /etc/nginx/security-headers.conf;

    # Compression des réponses texte.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Sonde de disponibilité pour l'orchestrateur / le smoke test CI.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets fingerprintés par Vite (hash dans le nom) : cache long immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Configuration injectée au démarrage (EV-64). Le fichier est produit par
    # envsubst dans /etc/nginx/ et servi ici par alias : la racine web
    # appartient à root et n'est pas accessible en écriture au conteneur, rien
    # n'y est donc généré.
    #
    # `no-cache` est indispensable : un config.js mis en cache ferait appeler
    # l'ancienne adresse d'API après un changement de configuration, sans que
    # rien ne l'indique.
    location = /config.js {
        alias /etc/nginx/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Routage côté client : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais être mis en cache, sinon un déploiement ne se
    # voit pas côté navigateur.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
