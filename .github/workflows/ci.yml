name: ci

# Sur chaque pull request vers develop, et sur develop après fusion. Une PR
# vers master a develop pour tête : son commit est déjà testé par le run du
# push, dont les checks s'affichent sur la PR, la relancer le testerait deux
# fois. master n'est pas listé non plus : cd.yml rejoue cette CI avant de
# construire l'image.
on:
  pull_request:
    branches-ignore: [master]
  push:
    branches: [develop]
  workflow_call:
    inputs:
      skip-image-scans:
        description: >-
          Ne pas scanner ici une image reconstruite : l'appelant scanne
          lui-même l'image qu'il publie.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Sur une pull request, l'image scannée est reconstruite ici : elle éprouve
  # le Dockerfile et les couches de base, pas l'image livrée, que cd.yml
  # scanne lui-même avant de la publier. Bloquant sur les CVE High et Critical
  # qui ont un correctif.
  sca-grype:
    name: Grype (CVE corrigeables de l'image)
    needs: lint-test-build
    if: ${{ !inputs.skip-image-scans }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Construire l'image à scanner
        run: docker build -t enervision-dashboard:scan .

      - name: Grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: enervision-dashboard:scan
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
          output-file: grype-report.txt

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### Grype — CVE corrigeables (>= high)"
            echo
            echo '```'
            cat grype-report.txt || echo "(aucun rapport produit)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-report
          path: grype-report.txt
          if-no-files-found: warn

  # Scan dynamique : l'image est démarrée et c'est elle que ZAP interroge. Sur
  # une application monopage compilée, c'est la configuration de service qui
  # est éprouvée (en-têtes, cache, fichiers exposés). Bloquant : toute alerte
  # absente de .zap/rules.tsv fait échouer le job.
  dast-zap:
    name: OWASP ZAP (scan du dashboard)
    needs: lint-test-build
    if: ${{ !inputs.skip-image-scans }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Construire l'image à scanner
        run: docker build -t enervision-dashboard:scan .

      - name: OWASP ZAP
        run: .github/scripts/zap-baseline.sh enervision-dashboard:scan

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### OWASP ZAP — scan du dashboard"
            echo
            cat zap-report/rapport.md || echo "(aucun rapport produit)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: zap-report/rapport.*
          if-no-files-found: warn
