name: ci

on:
  push:
  pull_request:

jobs:
  lint-test-build:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests
        run: npm test --if-present

      - name: Build
        run: npm run build
