name: ci

on:
  # Sur master, la CI est jouée par cd.yml (via workflow_call) juste avant le
  # build de l'image : inutile de la lancer deux fois.
  push:
    branches-ignore: [master]
  pull_request:
  # Réutilisable : cd.yml appelle ce workflow pour garder une seule définition
  # des étapes lint / tests / build.
  workflow_call:

jobs:
  lint-test-build:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
