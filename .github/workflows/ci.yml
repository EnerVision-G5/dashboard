name: ci

on:
  # Sur master, la CI est jouée par cd.yml (via workflow_call) juste avant le
  # build de l'image : inutile de la lancer deux fois.
  push:
    branches-ignore: [master]
  pull_request:
  # Réutilisable : cd.yml appelle ce workflow pour garder une seule définition
  # des étapes lint / tests / build et des scans de sécurité.
  workflow_call:

jobs:
  lint-test-build:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Analyse de composition logicielle. C'est l'image de production qui est
  # scannée, pas package-lock.json seul : les CVE arrivent aussi par les
  # couches de base node:24-alpine et nginx-unprivileged, que le lock du projet
  # ne décrit pas.
  sca-grype:
    name: Grype (CVE de l'image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Même Dockerfile que la livraison : ce qui est scanné ici est ce qui
      # sera publié par cd.yml, à l'identique.
      - name: Construire l'image à scanner
        run: docker build -t enervision-dashboard:scan .

      - name: Grype
        uses: anchore/scan-action@v6
        with:
          image: enervision-dashboard:scan
          # Bloque la CI sur High et Critical seulement, et seulement si un
          # correctif existe : une CVE sans version corrigée n'est pas une
          # action possible, la signaler bloquerait toutes les PR sans que
          # personne ne puisse la lever.
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
          output-file: grype-report.txt

      # always() : ces deux étapes doivent tourner même quand Grype a bloqué,
      # sinon le rapport qui explique l'échec n'est jamais publié.
      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### Grype — CVE corrigeables (>= high)"
            echo
            echo '```'
            cat grype-report.txt || echo "(aucun rapport produit)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype-report.txt
          if-no-files-found: warn

  # Scan dynamique (DAST) : l'image de production est réellement démarrée, et
  # c'est elle que ZAP interroge. Sur une application monopage compilée, ce que
  # le scan éprouve est la configuration de service — en-têtes de réponse,
  # directives de cache, exposition de fichiers non prévus — puisque le reste
  # du comportement vit côté navigateur et côté API.
  dast-zap:
    name: OWASP ZAP (scan du dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SCAN_TARGET: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image à scanner
        run: docker build -t enervision-dashboard:scan .

      - name: Démarrer le dashboard à scanner
        run: |
          docker run --rm -d --name dashboard-scan -p 8080:8080 \
            enervision-dashboard:scan
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "$SCAN_TARGET/healthz" >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs dashboard-scan
          test "$ok" = 1

      # Codes de sortie de zap-baseline.py : 1 si une règle FAIL est
      # déclenchée, 2 si une alerte reste en WARN, donc toute alerte non listée
      # dans .zap/rules.tsv casse le job. Pour rendre le scan informatif au lieu
      # de bloquant, ajouter -I à la commande ci-dessous.
      #
      # Pas d'araignée AJAX (-j) : le dashboard n'a pas d'API à joindre sur le
      # runner, les routes applicatives ne rendraient donc que leur état
      # d'erreur. L'exploration reste sur ce que Nginx sert réellement, ce qui
      # rend aussi le résultat reproductible d'un run à l'autre.
      #
      # ZAP tourne dans son propre conteneur : --network host pour qu'il
      # atteigne le port publié par le runner, et /zap/wrk monté sur un
      # répertoire du workspace pour en ressortir les rapports. Le conteneur
      # écrit sous un autre uid que le runner, d'où le chmod.
      - name: OWASP ZAP
        run: |
          mkdir -p zap-report
          cp .zap/rules.tsv zap-report/rules.tsv
          chmod -R 777 zap-report
          docker run --rm --network host \
            -v "$PWD/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "$SCAN_TARGET" \
              -c rules.tsv \
              -r rapport.html \
              -w rapport.md \
              -J rapport.json

      - name: Arrêter le dashboard
        if: always()
        run: docker rm -f dashboard-scan >/dev/null 2>&1 || true

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### OWASP ZAP — scan du dashboard"
            echo
            cat zap-report/rapport.md || echo "(aucun rapport produit)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/rapport.*
          if-no-files-found: warn
