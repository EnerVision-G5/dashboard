name: cd

# Livraison de l'image Docker du dashboard : à chaque push sur master, et à la
# demande pour republier un commit déjà intégré. L'image est construite une
# seule fois, vérifiée (Grype, ZAP, smoke test), et poussée en dernier : aucun
# tag n'atteint GHCR tant qu'un contrôle a échoué.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Lint, tests et build Vite. Les scans d'image de la CI sont sautés : c'est
  # l'image construite ci-dessous, celle qui sera publiée, qui est scannée.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip-image-scans: true
    secrets: inherit

  build:
    name: Construire, vérifier puis publier l'image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # GHCR exige un nom d'image en minuscules.
      - name: Préparer la référence d'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Calculer tags et labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Chargée dans le démon local, pas poussée : tout ce qui suit porte sur
      # ces octets-là, et ce sont eux que `docker push` enverra.
      - name: Construire l'image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: ${{ env.IMAGE }}:latest
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
          output-file: grype-report.txt

      - name: OWASP ZAP
        run: .github/scripts/zap-baseline.sh "$IMAGE:latest"

      # Démarrage sans aucun fichier du dépôt, comme sur l'hôte cible.
      - name: Smoke test
        run: |
          docker run --rm -d --name front-smoke -p 8080:8080 "$IMAGE:latest"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null \
               && curl -fsS http://localhost:8080/ | grep -q '<div id="root">'; then
              ok=1; break
            fi
            sleep 1
          done
          docker logs front-smoke
          docker rm -f front-smoke >/dev/null
          test "$ok" = 1

      - name: Connexion à GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image vérifiée
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest")
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"

      - name: Récapitulatif
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            if [ -n "$DIGEST" ]; then
              echo "### Image publiée"
              echo
              echo '```'
              echo "$TAGS"
              echo '```'
              echo
              echo "digest : \`$DIGEST\`"
            else
              echo "### Image NON publiée"
              echo
              echo "Un contrôle a échoué avant le push (Grype, ZAP ou smoke test) : aucun tag n'a été envoyé sur GHCR."
            fi
            echo
            echo "#### Grype"
            echo '```'
            cat grype-report.txt 2>/dev/null || echo "(pas de rapport)"
            echo '```'
            echo
            echo "#### OWASP ZAP"
            cat zap-report/rapport.md 2>/dev/null || echo "(pas de rapport)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapports-image
          path: |
            grype-report.txt
            zap-report/rapport.*
          if-no-files-found: warn
