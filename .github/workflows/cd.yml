name: cd

# Livraison de l'image Docker du dashboard.
#
# À chaque poussée sur master (donc à chaque merge intégré), on rejoue d'abord
# l'intégralité de la CI (lint + tests + build) puis, seulement si elle passe,
# on construit l'image de production et on la publie sur GHCR en la taguant
# avec le SHA Git.
on:
  push:
    branches: [master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Barrière qualité : réutilise ci.yml tel quel. `build` ne démarre pas tant
  # que eslint, les tests et le build Vite ne sont pas verts.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build & push image (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Nom d'image en minuscules (GHCR l'exige, le nom de repo peut contenir
      # des majuscules).
      - name: Préparer la référence d'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton éphémère fourni par Actions, jamais stocké dans l'image.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reproduit un déploiement sur machine vierge : pull par digest immuable,
      # démarrage sans aucun fichier du dépôt, vérification du service.
      - name: Smoke test de l'image publiée
        run: |
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run --rm -d --name front-smoke -p 8080:8080 "$ref"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null \
               && curl -fsS http://localhost:8080/ | grep -q '<div id="root">'; then
              ok=1; break
            fi
            sleep 1
          done
          docker logs front-smoke
          docker rm -f front-smoke >/dev/null
          test "$ok" = 1

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest : \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
