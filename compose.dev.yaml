# compose.dev.yaml — environnement de dev du front
#
# Démarrage :   docker compose -f compose.dev.yaml up
# Arrêt :       docker compose -f compose.dev.yaml down
# Rebuild deps : docker compose -f compose.dev.yaml up --build
#
# Le dossier courant est monté dans le container : toute modification de fichier
# est vue par Vite qui recharge la page en temps réel (HMR).

services:
  front:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # Code source monté depuis l'hôte -> hot reload
      - .:/app
      # node_modules dans un volume nommé : on garde ceux installés dans l'image
      # et on n'écrase pas avec ceux (potentiellement absents/différents) de l'hôte
      - front_node_modules:/app/node_modules
    environment:
      # Force le watch par polling : indispensable pour que le HMR fonctionne
      # de façon fiable depuis un bind mount (Windows, macOS, WSL2...)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    # Garde stdin ouvert pour un usage interactif éventuel
    stdin_open: true
    tty: true

volumes:
  front_node_modules:
